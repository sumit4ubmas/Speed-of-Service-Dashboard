<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KDS Kitchen Performance Dashboard (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f2f2f5}
a{color:#5b21d6}a:hover{color:#3f139e}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #5b21d6;outline-offset:2px}
.drow:hover:not(:disabled){background:#f8f5ff !important}
.kcard:hover{border-color:#b9a4f2 !important;box-shadow:0 2px 10px rgba(91,33,214,0.10)}
.tbtn:hover{background:#f1ecfd !important}
</style>
</head>
<body>
<!-- Prototype: all figures are simulated for design review; not connected to a live database. -->
<div id="app"></div>
<template id="dc-template">
<div style="min-height: 100vh; background: #f2f2f5; font-family: 'Public Sans', system-ui, sans-serif; color: #18181b; font-size: 14px;">

  <header style="background: #19191e; color: #ffffff; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 12px 20px;">
    <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">
      <div style="width: 30px; height: 30px; border-radius: 8px; background: #6d35e8; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px;">KDS</div>
      <span style="font-weight: 700; font-size: 15px;">Kitchen Performance</span>
      <span style="color: #b4b4bf; font-size: 14px;">Speed of Service &amp; Bottlenecks</span>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <span style="font-family: 'JetBrains Mono', monospace; color: #c9c9d3; font-size: 13px;">Oct 19, 2026</span>
      <div style="width: 30px; height: 30px; border-radius: 50%; background: #2563eb; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px;">S</div>
    </div>
  </header>

  <main style="max-width: 1400px; margin: 0 auto; padding: 18px 16px 48px; box-sizing: border-box;">
    <section style="background: #ffffff; border: 1px solid #e4e4ea; border-radius: 12px; overflow: hidden;">

      <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 16px 20px; border-bottom: 1px solid #ececf1;">
        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
          <div style="width: 24px; height: 24px; border-radius: 6px; background: #efe9fd; color: #5b21d6; display: flex; align-items: center; justify-content: center;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2.5M9 2h6"></path></svg>
          </div>
          <h1 style="margin: 0; font-size: 18px; font-weight: 700;">KDS Kitchen Performance Report</h1>
          <span title="Every figure on this page comes from a fixed simulated dataset for design review. Nothing is read from a live database." style="font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #8a4b00; background: #fff3dc; border: 1px solid #f1d9a8; border-radius: 999px; padding: 3px 9px;">PROTOTYPE · SIMULATED DATA</span>
        </div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
          <button onClick="{{toggleDefs}}" aria-expanded="{{defsOn}}" style="{{defsBtnStyle}}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg>Definitions &amp; data notes
          </button>
          <button aria-label="Export to Excel or PDF" style="background: transparent; border: 1px solid #e4e4ea; border-radius: 8px; color: #3f3f46; padding: 7px 12px; display: flex; align-items: center; gap: 6px; font-size: 13px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 19h16"></path></svg>Export
          </button>
        </div>
      </div>

      <sc-if value="{{defsOn}}" hint-placeholder-val="{{false}}">
        <div style="margin: 14px 20px 0; padding: 14px 16px; border: 1px solid #e3d8fb; border-radius: 10px; background: #fbf9ff; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px 22px; font-size: 13px; color: #27272a;">
          <div><strong>Tickets</strong> · unique orders. A ticket counts once for the store even when it passes through several prep areas.</div>
          <div><strong>Items</strong> · sum of item quantities on those tickets (2 fries = 2 items), not distinct menu items.</div>
          <div><strong>Station records</strong> · one record per ticket per prep area it passes through. Bucket counts are station records, so their total is larger than unique tickets.</div>
          <div><strong>Avg ticket completion time</strong> · one duration per ticket. Start and end events: pending confirmation with KDS engineering.</div>
          <div><strong>Avg prep-area time</strong> · one duration per station record. Start and end events: pending confirmation with KDS engineering.</div>
          <div><strong>Averages</strong> · total duration ÷ valid record count for the whole scope, never an average of averages.</div>
          <div><strong>Speed buckets</strong> · each record is classified by its own prep area's thresholds:
            <sc-for list="{{thrRef}}" as="t" hint-placeholder-count="3"><div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #3f3f46; margin-top: 2px;">{{t.label}} · {{t.text}}</div></sc-for>
          </div>
          <div><strong>Thresholds</strong> · set per prep area in KDS settings (Prep areas › Speed thresholds), not on this report. Values shown are sample settings.</div>
          <div><strong>Data status</strong> · simulated dataset for design review, shaped like #353's 9/21–10/16 export. Our current exports count station records only, so unique tickets and items here are simulated.</div>
        </div>
      </sc-if>

      <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px 16px; padding: 14px 20px 6px;">
        <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #52525b;">Date
          <select value="{{preset}}" onChange="{{onPreset}}" style="font-family: inherit; font-size: 14px; color: #18181b; border: 1px solid #dcdce3; border-radius: 8px; padding: 8px 10px; background: #ffffff; min-width: 160px;">
            <option value="4w">Last 4 weeks</option>
            <option value="8w">Last 8 weeks</option>
            <option value="7d">Last 7 days</option>
            <option value="1d">Yesterday</option>
            <option value="custom">Custom range…</option>
          </select>
        </label>
        <sc-if value="{{isCustom}}" hint-placeholder-val="{{false}}">
          <span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
            <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #52525b;">From <input type="date" value="{{fromVal}}" onChange="{{onFrom}}" style="font-family: inherit; font-size: 14px; border: 1px solid #dcdce3; border-radius: 8px; padding: 7px 8px;"></label>
            <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #52525b;">To <input type="date" value="{{toVal}}" onChange="{{onTo}}" style="font-family: inherit; font-size: 14px; border: 1px solid #dcdce3; border-radius: 8px; padding: 7px 8px;"></label>
          </span>
        </sc-if>
        <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #52525b;">Store
          <select value="{{storeId}}" onChange="{{onStore}}" style="font-family: inherit; font-size: 14px; color: #18181b; border: 1px solid #dcdce3; border-radius: 8px; padding: 8px 10px; background: #ffffff; min-width: 210px;">
            <option value="353">#353 Dallas Fort Worth</option>
            <option value="362">#362 Riverton</option>
            <option value="296">#296 Orlando</option>
            <option value="410">#410 Austin</option>
          </select>
        </label>
        <span style="color: #5b5b66; font-size: 13px;">{{rangeText}}</span>
      </div>
      <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; padding: 4px 20px 14px;">
        <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #27272a; cursor: pointer;">
          <input type="checkbox" checked="{{exclOn}}" onChange="{{onExcl}}" style="width: 16px; height: 16px; accent-color: #5b21d6;">Exclude durations &gt;60 min from averages
        </label>
        <span title="Off by default until the business confirms the rule. When on, records over 60 minutes are left out of every average on this page (cards, tables, drill-downs, trends) but still count in volume and in their speed bucket." style="font-size: 12px; color: #5b5b66; border-bottom: 1px dotted #9a9aa6; cursor: help;">Default off · pending business confirmation</span>
        <sc-if value="{{exclOn}}" hint-placeholder-val="{{false}}">
          <span style="font-size: 12px; color: #2e1a63; background: #f1ecfd; border-radius: 6px; padding: 4px 8px;">{{exclNote}}</span>
        </sc-if>
      </div>

      <sc-if value="{{noData}}" hint-placeholder-val="{{false}}">
        <div style="margin: 4px 20px 22px; padding: 28px 24px; border: 1px dashed #c9b8f6; border-radius: 12px; background: #fbf9ff; text-align: center;">
          <div style="font-size: 17px; font-weight: 700;">{{emptyTitle}}</div>
          <div style="font-size: 13px; color: #5b5b66; margin: 6px auto 14px; max-width: 560px;">{{emptyText}}</div>
          <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
            <button onClick="{{emptyFix1}}" style="border: 0; border-radius: 8px; background: #5b21d6; color: #ffffff; padding: 9px 14px; font-size: 13px; font-weight: 600;">{{emptyFix1Label}}</button>
            <button onClick="{{emptyFix2}}" style="border: 1px solid #dcdce3; border-radius: 8px; background: #ffffff; color: #3f3f46; padding: 9px 14px; font-size: 13px; font-weight: 600;">{{emptyFix2Label}}</button>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{hasData}}" hint-placeholder-val="{{true}}">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; padding: 0 20px 18px;">
          <sc-for list="{{kpis}}" as="k" hint-placeholder-count="6">
            <div class="kcard" title="{{k.tip}}" style="{{k.cardStyle}}">
              <button onClick="{{k.pick}}" aria-label="{{k.aria}}" style="display: block; width: 100%; padding: 0; border: 0; background: transparent; font: inherit; color: inherit; text-align: left; cursor: pointer;">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 6px;">
                  <span style="display: flex; align-items: center; gap: 6px;">
                    <span style="font-size: 13px; font-weight: 600; color: #27272a;">{{k.label}}</span>
                    <sc-if value="{{k.hasBadge}}" hint-placeholder-val="{{false}}">
                      <span style="font-size: 10px; font-weight: 700; color: #a61b1b; background: #fde8e8; border-radius: 4px; padding: 2px 6px;">{{k.badge}}</span>
                    </sc-if>
                  </span>
                  <span style="font-size: 11px; font-weight: 600; color: #5b21d6; white-space: nowrap;">{{k.drill}} ›</span>
                </div>
                <div style="display: flex; align-items: baseline; gap: 6px; margin: 6px 0 2px;">
                  <span style="font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 600; letter-spacing: -0.01em;">{{k.value}}</span>
                  <span style="font-size: 11px; font-weight: 600; color: #5b5b66;">{{k.unit}}</span>
                </div>
              </button>
              <button class="tbtn" onClick="{{k.trendPick}}" aria-label="{{k.trendAria}}" aria-expanded="{{k.trendOn}}" style="{{k.trendStyle}}">
                <svg width="100%" height="30" viewBox="0 0 160 30" preserveAspectRatio="none" aria-hidden="true" style="display: block;"><polyline points="{{k.points}}" fill="none" stroke="{{k.color}}" stroke-width="1.6" vector-effect="non-scaling-stroke"></polyline></svg>
              </button>
              <div style="display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; border-top: 1px solid #f0f0f4; padding-top: 8px;">
                <div><div style="font-size: 10px; letter-spacing: 0.05em; color: #6b6b76; text-transform: uppercase;">{{k.l1}}</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 13px;">{{k.v1}}</div></div>
                <div style="text-align: right;"><div style="font-size: 10px; letter-spacing: 0.05em; color: #6b6b76; text-transform: uppercase;">{{k.l2}}</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 13px;">{{k.v2}}</div></div>
              </div>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{trendOpen}}" hint-placeholder-val="{{false}}">
        <section aria-label="Enlarged trend" style="margin: 0 20px 18px; border: 1px solid #d9cdfa; border-radius: 12px; background: #ffffff; padding: 16px 18px;">
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
            <div>
              <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.05em; color: #5b21d6; text-transform: uppercase;">Trend · daily</div>
              <div style="font-size: 18px; font-weight: 700; margin-top: 2px;">{{tTitle}}</div>
              <div style="font-size: 13px; color: #5b5b66; margin-top: 2px;">{{tSub}}</div>
            </div>
            <button onClick="{{closeTrend}}" aria-label="Close trend" style="border: 1px solid #dcdce3; border-radius: 8px; background: #ffffff; color: #3f3f46; padding: 8px 12px; font-size: 13px; font-weight: 600;">Close</button>
          </div>
          <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px;" role="group" aria-label="Trend metric">
            <sc-for list="{{tMetrics}}" as="m" hint-placeholder-count="8">
              <button aria-pressed="{{m.on}}" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
            </sc-for>
          </div>
          <sc-if value="{{tTooShort}}" hint-placeholder-val="{{false}}">
            <div style="margin-top: 14px; padding: 16px; border: 1px dashed #c9b8f6; border-radius: 10px; font-size: 13px; color: #3f3f46; text-align: center;">A trend needs at least two days. Pick a longer date range to see this chart.</div>
          </sc-if>
          <sc-if value="{{tChart}}" hint-placeholder-val="{{true}}">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 12px;">
              <sc-for list="{{tStats}}" as="st" hint-placeholder-count="4">
                <button onClick="{{st.pick}}" style="text-align: left; border: 1px solid #ececf1; border-radius: 8px; background: #fcfcfd; padding: 8px 10px; font: inherit; color: inherit; cursor: pointer;">
                  <div style="font-size: 10px; letter-spacing: 0.05em; color: #6b6b76; text-transform: uppercase;">{{st.label}}</div>
                  <div style="font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600;">{{st.value}}</div>
                  <div style="font-size: 11px; color: #5b5b66;">{{st.note}}</div>
                </button>
              </sc-for>
            </div>
            <sc-if value="{{tLegendShow}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; font-weight: 600; color: #27272a;">
                <sc-for list="{{tLegend}}" as="l" hint-placeholder-count="3">
                  <span style="display: flex; align-items: center; gap: 6px;"><span style="{{l.sw}}"></span>{{l.label}}</span>
                </sc-for>
              </div>
            </sc-if>
            <div style="overflow-x: auto; margin-top: 10px;">
              <div style="min-width: 720px;">
                <div style="position: relative; width: 100%; aspect-ratio: 1000 / 260;">
                  <svg viewBox="0 0 1000 260" preserveAspectRatio="none" role="img" aria-label="{{tAria}}" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%;">
                    <path d="{{gridPath}}" stroke="#e7e7ee" stroke-width="1" fill="none" vector-effect="non-scaling-stroke"></path>
                    <polygon points="{{tArea}}" fill="{{tAreaFill}}"></polygon>
                    <line x1="48" x2="984" y1="{{avgY}}" y2="{{avgY}}" stroke="{{avgStroke}}" stroke-width="1.2" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"></line>
                    <line x1="{{selX}}" x2="{{selX}}" y1="12" y2="248" stroke="#8b6cf0" stroke-width="1.4" vector-effect="non-scaling-stroke"></line>
                    <polyline points="{{s1.points}}" fill="none" stroke="{{s1.color}}" stroke-width="{{s1.w}}" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>
                    <polyline points="{{s2.points}}" fill="none" stroke="{{s2.color}}" stroke-width="{{s2.w}}" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>
                    <polyline points="{{s3.points}}" fill="none" stroke="{{s3.color}}" stroke-width="{{s3.w}}" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>
                    <circle cx="{{selX}}" cy="{{s1.cy}}" r="{{s1.r}}" fill="{{s1.color}}" stroke="#ffffff" stroke-width="2"></circle>
                    <circle cx="{{selX}}" cy="{{s2.cy}}" r="{{s2.r}}" fill="{{s2.color}}" stroke="#ffffff" stroke-width="2"></circle>
                    <circle cx="{{selX}}" cy="{{s3.cy}}" r="{{s3.r}}" fill="{{s3.color}}" stroke="#ffffff" stroke-width="2"></circle>
                  </svg>
                  <sc-for list="{{tGrid}}" as="g" hint-placeholder-count="5">
                    <div style="{{g.style}}">{{g.label}}</div>
                  </sc-for>
                  <sc-if value="{{avgShow}}" hint-placeholder-val="{{false}}">
                    <div style="{{avgLabelStyle}}">{{avgLabel}}</div>
                  </sc-if>
                </div>
                <div style="{{tDaysGrid}}" role="group" aria-label="Pick a day">
                  <sc-for list="{{tDays}}" as="d" hint-placeholder-count="28">
                    <button onClick="{{d.pick}}" aria-label="{{d.aria}}" aria-pressed="{{d.on}}" style="{{d.style}}"><span style="display: block; font-size: 9px; font-weight: 700; min-height: 11px;">{{d.mon}}</span>{{d.day}}</button>
                  </sc-for>
                </div>
              </div>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-start; margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: #faf8ff; border: 1px solid #ece4fd;">
              <div style="flex: 1 1 200px;">
                <div style="font-size: 12px; font-weight: 700; color: #3f3f46;">{{tDayTitle}}</div>
                <div style="display: flex; align-items: baseline; gap: 6px; margin-top: 2px;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 600;">{{tDayValue}}</span><span style="font-size: 11px; font-weight: 600; color: #5b5b66;">{{tUnit}}</span></div>
                <div style="{{tDeltaStyle}}">{{tDelta}}</div>
                <button onClick="{{tWeekdayPick}}" style="margin-top: 10px; border: 0; background: transparent; color: #5b21d6; font-size: 13px; font-weight: 600; padding: 4px 0;">{{tWeekdayLabel}} ›</button>
              </div>
              <div style="flex: 3 1 420px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px;">
                <sc-for list="{{tDetail}}" as="r" hint-placeholder-count="3">
                  <div style="background: #ffffff; border: 1px solid #ececf1; border-radius: 8px; padding: 8px 10px;">
                    <div style="display: flex; justify-content: space-between; gap: 6px; font-size: 12px; font-weight: 600; color: #3f3f46;"><span>{{r.name}}</span><span style="font-family: 'JetBrains Mono', monospace;">{{r.pct}}</span></div>
                    <div style="font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600; margin: 2px 0 6px;">{{r.main}}</div>
                    <div style="height: 6px; border-radius: 3px; background: #efeff3; overflow: hidden;"><div style="{{r.bar}}"></div></div>
                  </div>
                </sc-for>
              </div>
            </div>
          </sc-if>
        </section>
      </sc-if>

      <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 14px 20px; border-top: 1px solid #ececf1; border-bottom: 1px solid #ececf1; background: #fcfcfd;">
        <div style="display: flex; align-items: center; gap: 4px; flex-wrap: wrap;" role="tablist" aria-label="Report view">
          <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
            <button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
          </sc-for>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
          <span style="font-size: 12px; color: #5b5b66; font-weight: 600;">Prep area</span>
          <div style="display: flex; border: 1px solid #dcdce3; border-radius: 999px; overflow: hidden;">
            <sc-for list="{{preps}}" as="p" hint-placeholder-count="4">
              <button aria-pressed="{{p.on}}" onClick="{{p.pick}}" style="{{p.style}}">{{p.label}}</button>
            </sc-for>
          </div>
        </div>
      </div>

      <nav aria-label="Drill path" style="display: flex; align-items: center; flex-wrap: wrap; gap: 4px; padding: 12px 20px 0; font-size: 13px;">
        <sc-for list="{{crumbs}}" as="b" hint-placeholder-count="4">
          <span style="display: flex; align-items: center; gap: 4px;">
            <sc-if value="{{b.sep}}" hint-placeholder-val="{{false}}"><span style="color: #9a9aa6;" aria-hidden="true">›</span></sc-if>
            <button onClick="{{b.pick}}" style="{{b.style}}">{{b.label}}</button>
          </span>
        </sc-for>
      </nav>

      <div style="display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 8px 20px 12px;">
        <div>
          <h2 style="margin: 2px 0 4px; font-size: 20px; font-weight: 700;">{{tabTitle}}</h2>
          <div style="font-size: 13px; color: #5b5b66;">{{tabSub}}</div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end;">
          <div style="display: flex; gap: 6px; flex-wrap: wrap;" role="group" aria-label="Focus a speed bucket">
            <sc-for list="{{legend}}" as="g" hint-placeholder-count="3">
              <button aria-pressed="{{g.on}}" onClick="{{g.pick}}" title="{{g.tip}}" style="{{g.style}}"><span style="{{g.sw}}"></span>{{g.label}}</button>
            </sc-for>
          </div>
          <sc-if value="{{showModeToggle}}" hint-placeholder-val="{{true}}">
            <div style="display: flex; border: 1px solid #dcdce3; border-radius: 999px; overflow: hidden;" role="group" aria-label="Cell detail">
              <button aria-pressed="{{modeCountsOn}}" onClick="{{setCounts}}" style="{{modeCountsStyle}}">Counts</button>
              <button aria-pressed="{{modeDetailOn}}" onClick="{{setDetail}}" style="{{modeDetailStyle}}">Count · Avg · %</button>
            </div>
          </sc-if>
        </div>
      </div>

      <sc-if value="{{varies}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 20px 12px; font-size: 12px;">
          <span style="font-weight: 700; color: #3f3f46;">Thresholds vary by prep area</span>
          <sc-for list="{{thrRef}}" as="t" hint-placeholder-count="3">

  Build: { caution: 4, extended: 8 },
  Fry:   { caution: 2, extended: 5 }

/* ===== Stores, calendar ===== */

const dayDate = i => new Date(2026, 7, 23 + i);
const MONS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WDS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WDPL = { Sun: 'Sundays', Mon: 'Mondays', Tue: 'Tuesdays', Wed: 'Wednesdays', Thu: 'Thursdays', Fri: 'Fridays', Sat: 'Saturdays' };
const pad2 = v => String(v).padStart(2, '0');
const isoOf = i => { const d = dayDate(i); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const idxOf = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); if (!m) return null; return Math.round((Date.UTC(+m[1], +m[2] - 1, +m[3]) - Date.UTC(2026, 7, 23)) / 864e5); };
const shortOf = i => { const d = dayDate(i); return (d.getMonth() + 1) + '/' + d.getDate(); };
const longOf = i => { const d = dayDate(i); return WDS[d.getDay()] + ' ' + MONS[d.getMonth()] + ' ' + d.getDate(); };

const PART = h => (h <= 10 ? 'm' : h <= 15 ? 'l' : 'd');

          : m.unit === 'count' ? [{ name: 'Tickets (unique)', main: n0(dayX.t), pct: '', bar: 'height: 100%; width: 100%; background: #5b21d6;' }, { name: 'Items', main: n0(dayX.it), pct: '', bar: 'height: 100%; width: 100%; background: #7c5ce6;' }].concat(bucketRows(dayX))
          : bucketRows(dayX);
        const dv = main[sel] == null ? 0 : main[sel] - mean;
        const isBad = (m.worse === 'high' && dv > 0) || (m.worse === 'low' && dv < 0);
        const deltaTxt = m.unit === 'pct' ? Math.abs(dv).toFixed(1) + ' pts' : m.unit === 'count' ? n0(Math.abs(dv)) : mmss(Math.abs(dv));

        const best = m.multi ? STN.map((p, k) => ({ p, v: m.series[k].vals[sel] })).filter(q => q.v != null).sort((a, b) => b.v - a.v)[0] : null;
        Object.assign(trend, { tChart: true, tStats, tLegendShow: !!m.multi, tLegend: m.series.map(x => ({ label: x.name, sw: 'display: inline-block; width: 16px; height: 3px; border-radius: 2px; background: ' + x.color + ';' })),
          tAria: m.label + ' by day, ' + fmtV(Math.min(...allV)) + ' to ' + fmtV(Math.max(...allV)), gridPath, tGrid,
          tArea: m.multi ? '' : X(0).toFixed(1) + ',248 ' + sv(0).points + ' ' + X(N - 1).toFixed(1) + ',248', tAreaFill: m.multi ? 'none' : m.series[0].color + '1f',
          avgY: m.multi ? -20 : Y(mean).toFixed(1), avgStroke: m.multi ? 'none' : '#6b6b76', avgShow: !m.multi, avgLabel: 'mean ' + fmtV(mean),
          avgLabelStyle: 'position: absolute; right: 0; transform: translateY(-120%); font-size: 11px; font-weight: 600; color: #3f3f46; background: #ffffff; padding: 0 4px; top: ' + (Y(mean) / 260 * 100).toFixed(2) + '%;',
          selX: X(sel).toFixed(1), s1: sv(0), s2: sv(1), s3: sv(2), tDaysGrid: 'display: grid; grid-template-columns: repeat(' + N + ', minmax(0, 1fr)); gap: 2px; margin: 4px 1.6% 0 4.8%;', tDays, tDetail,
          tDayTitle: dl(sel) + (m.multi ? ' · Extended by prep area' : ''),
          tDayValue: m.multi ? (best ? best.p + ' ' + best.v.toFixed(1) + '%' : '—') : fmtV(main[sel]),
          tDelta: m.multi ? 'Highest Extended share that day; each area uses its own threshold' : (Math.abs(dv) < 0.05 ? 'At the period mean' : deltaTxt + (dv > 0 ? ' above' : ' below') + ' the period mean'),
          tDeltaStyle: 'font-size: 12px; font-weight: 600; color: ' + (m.multi || m.worse === 'none' ? '#5b5b66' : isBad ? '#9b1c14' : '#145c3d') + ';',
          tWeekdayLabel: 'All ' + WDPL[WDS[wdIdx]] + ' in Daily', tWeekdayPick: set({ tab: 'daily', drill: { type: 'day', key: wdIdx } }) });
      }
    }

    /* ----- breadcrumbs ----- */
    const crumbStyle = last => 'border: 0; background: transparent; padding: 4px 6px; border-radius: 6px; font-size: 13px; font-weight: ' + (last ? '700' : '600') + '; color: ' + (last ? '#18181b' : '#5b21d6') + ';';
    const crumbList = [{ label: store.name, pick: set({ prep: 'All', drill: null, bucket: null, tab: 'summary' }) },
      { label: rangeShort, pick: set({ drill: null }) },
      { label: scopeName, pick: set({ drill: null, bucket: null }) },

    if (focus >= 0) crumbList.push({ label: BNAME[focus] + ' focus', pick: set({ bucket: null }) });

    const crumbs = crumbList.map((c, i) => Object.assign(c, { sep: i > 0, style: crumbStyle(i === crumbList.length - 1) }));

    const META = {

      hourly: ['Hourly performance', 'Hour × speed bucket with day-part subtotals. Click an hour, a day part or the total to split it by prep area.'],

    return Object.assign({
      tabs, preps, legend, crumbs, kpis, thrRef, varies, bHeads, ticketHead,
      preset, isCustom: preset === 'custom', fromVal: isoOf(r0), toVal: isoOf(r1), storeId, rangeText,
      onPreset: e => { const v = e && e.target ? e.target.value : '4w'; this.setState(v === 'custom' ? { preset: v, from: r0, to: r1, drill: null, tday: null } : { preset: v, drill: null, tday: null }); },
      onFrom: e => { const i = idxOf(e && e.target ? e.target.value : ''); if (i != null) this.setState({ from: i, drill: null, tday: null }); },
      onTo: e => { const i = idxOf(e && e.target ? e.target.value : ''); if (i != null) this.setState({ to: i, drill: null, tday: null }); },

      exclOn: excl, onExcl: () => this.setState({ excl: !excl }), exclNote,
      defsOn: !!s.defs, toggleDefs: set({ defs: !s.defs }),
      defsBtnStyle: 'border: 1px solid ' + (s.defs ? '#5b21d6' : '#e4e4ea') + '; border-radius: 8px; background: ' + (s.defs ? '#f1ecfd' : 'transparent') + '; color: #3f3f46; padding: 7px 12px; display: flex; align-items: center; gap: 6px; font-size: 13px;',
      hasData, noData: !hasData, emptyTitle, emptyText, emptyFix1, emptyFix1Label, emptyFix2, emptyFix2Label,
      tabTitle: META[tab][0], tabSub: META[tab][1],
      showModeToggle: tab === 'hourly' && hasData, detail,
      modeCountsOn: detail ? 'false' : 'true', modeDetailOn: detail ? 'true' : 'false', modeCountsStyle: segStyle(!detail), modeDetailStyle: segStyle(detail),
      setCounts: set({ mode: 'counts' }), setDetail: set({ mode: 'detail' }),
      hasDrill: !!dx && tab !== 'summary' && tab !== 'items', drillTitle, drillCards,
      drillTickets: dx ? n0(dx.t) : '', drillItems: dx ? n0(dx.it) : '', drillComp: dx ? mmss(avgComp(dx)) : '', drillRecords: dx ? n0(sum3(recB(dx, -1))) : '',
      showTickets: !!s.tickets, toggleTickets: set({ tickets: !s.tickets }), closeDrill: set({ drill: null, tickets: false }),
      showSummary: hasData && tab === 'summary', showHourly: hasData && tab === 'hourly', showSpeed: hasData && tab === 'speed', showDaily: hasData && tab === 'daily', showStores: tab === 'stores' && !badRange, showItems: hasData && tab === 'items',
      summaryRows, summaryInsight, recordsNote, hHeadStyle, hourRows, hourInsight, speedRows, speedInsight, dailyRows, storeRows, storeScope,
      itemRows, itemsAny, itemsEmpty: hasData && !itemsAny, itemsEmptyText: 'No items reach ' + minQ + ' units in this range' + (pi < 0 ? '' : ' at ' + prep) + '. Widen the date range.', itemsNote
    }, trend);
  }
}

<script>
(function(){
  const tplRoot = document.getElementById('dc-template').content;
  const app = document.getElementById('app');
  const lookup = (scope, path) => {
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    let v = scope; for (const k of path.split('.')) { if (v == null) return undefined; v = v[k]; } return v;
  };
  const interp = (scope, str) => str.replace(/\{\{\s*([\w.$-]+)\s*\}\}/g, (_, p) => { const v = lookup(scope, p); return v == null ? '' : String(v); });
  const whole = str => { const m = /^\{\{\s*([\w.$-]+)\s*\}\}$/.exec(str); return m ? m[1] : null; };
  const BOOL = new Set(['disabled', 'checked', 'selected', 'hidden']);
  function render(node, scope, out) {
    if (node.nodeType === 3) { out.push(document.createTextNode(interp(scope, node.nodeValue))); return; }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === 'sc-for') {
      const list = lookup(scope, whole(node.getAttribute('list')) || '') || [];
      const as = node.getAttribute('as') || 'item';
      list.forEach((it, i) => { const child = Object.assign({}, scope, { [as]: it, $index: i }); node.childNodes.forEach(c => render(c, child, out)); });
      return;
    }
    if (tag === 'sc-if') { if (lookup(scope, whole(node.getAttribute('value')) || '')) node.childNodes.forEach(c => render(c, scope, out)); return; }
    const el = node.namespaceURI && node.namespaceURI !== 'http://www.w3.org/1999/xhtml' ? document.createElementNS(node.namespaceURI, node.tagName) : document.createElement(tag);
    let valueProp;
    for (const a of Array.from(node.attributes)) {
      if (a.name.startsWith('hint-')) continue;
      const w = whole(a.value);
      if (/^on[a-z]+$/.test(a.name)) { const fn = w ? lookup(scope, w) : null; if (typeof fn === 'function') el.addEventListener(a.name.slice(2), fn); continue; }
      if (BOOL.has(a.name)) { const v = w ? lookup(scope, w) : true; if (a.name === 'checked') el.checked = !!v; else if (v) el.setAttribute(a.name, ''); continue; }
      if (a.name === 'value' && (tag === 'select' || tag === 'input')) { valueProp = w ? lookup(scope, w) : a.value; continue; }
      if (w) { const v = lookup(scope, w); if (v == null || v === false) continue; el.setAttribute(a.name, String(v)); }
      else el.setAttribute(a.name, interp(scope, a.value));
    }
    const kids = []; node.childNodes.forEach(c => render(c, scope, kids)); kids.forEach(k => el.appendChild(k));
    if (valueProp !== undefined) el.value = valueProp == null ? '' : String(valueProp);
    out.push(el);
  }
  class DCLogic { constructor() { this.props = {}; this.state = null; } setState(o) { this.state = Object.assign({}, this.state || {}, o); schedule(); } forceUpdate() { schedule(); } }
  let comp, pending = false;
  function paint() { pending = false; const vals = comp.renderVals(); const out = []; tplRoot.childNodes.forEach(c => render(c, vals, out)); app.replaceChildren(...out); }
  function schedule() { if (!pending) { pending = true; Promise.resolve().then(paint); } }
  const Component = (new Function('DCLogic', document.getElementById('dc-logic').textContent + '\n;return Component;'))(DCLogic);
  comp = new Component(); paint();
})();
</script>
